<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 새싹: 형광 한 점. 16px 에서도 읽히도록 크고 단순한 3잎 -->
  <g fill="#8FFF00">
    <path d="M32 20c0-6-4-10-9-11 0 6 3 10 9 11z"/>
    <path d="M32 20c0-6 4-10 9-11 0 6-3 10-9 11z"/>
    <path d="M32 19c-2.6 0-4.5-3.2-4.5-7.5S29.4 4 32 4s4.5 3.2 4.5 7.5S34.6 19 32 19z"/>
  </g>
  <!-- 머리: 살짝 따뜻한 오프화이트 + 진한 외곽선(밝은 탭바에서도 형태가 남게) -->
  <ellipse cx="32" cy="40" rx="21" ry="20" fill="#FDFCF9" stroke="#2A2620" stroke-width="3.5"/>
  <!-- 눈: 작게 줄었을 때 제일 먼저 사라지는 게 눈이라 크게 -->
  <circle cx="24" cy="38" r="4.2" fill="#2A2620"/>
  <circle cx="40" cy="38" r="4.2" fill="#2A2620"/>
  <!-- 입 -->
  <path d="M28.5 47.5c1.6 2 5.4 2 7 0" fill="none" stroke="#2A2620" stroke-width="2.6" stroke-linecap="round"/>
</svg>
